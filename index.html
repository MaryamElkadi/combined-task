<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task 7 Combined Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header>
      <h1>Task 7 Integrated Demo</h1>
    </header>

    <section id="loading">
      <h2>Loading Animation</h2>
      <div class="section-inner">
        <div class="loader">
          <div class="square"></div>
          <div class="square"></div>
          <div class="square"></div>
          <div class="square"></div>
        </div>
      </div>
    </section>

    <section id="clock">
      <h2>Glassmorphism Animated Clock</h2>
      <div class="section-inner">
        <div class="clock-wrapper">
          <div class="blob1"></div>
          <div class="blob2"></div>
          <div class="clock">
            <div class="marks">
              <div class="mark" style="--i:1;"></div>
              <div class="mark" style="--i:2;"></div>
              <div class="mark" style="--i:3;"><div class="number-container"><span class="number">3</span></div></div>
              <div class="mark" style="--i:4;"></div>
              <div class="mark" style="--i:5;"></div>
              <div class="mark" style="--i:6;"><div class="number-container"><span class="number">6</span></div></div>
              <div class="mark" style="--i:7;"></div>
              <div class="mark" style="--i:8;"></div>
              <div class="mark" style="--i:9;"><div class="number-container"><span class="number">9</span></div></div>
              <div class="mark" style="--i:10;"></div>
              <div class="mark" style="--i:11;"></div>
              <div class="mark" style="--i:12;"><div class="number-container"><span class="number">12</span></div></div>
            </div>
            <div class="hand hour" style="animation-delay: -27903s;"></div>
            <div class="hand minute" style="animation-delay: -2703s;"></div>
            <div class="hand second" style="animation-delay: -3s;"></div>
            <div class="center-dot"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="card">
      <h2>Interactive Product Card</h2>
      <div class="section-inner">
        <div class="card">
          <div class="image-container">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Nike Air Max Sneakers" />
            <div class="overlay">
              <p class="overlay-text">Experience premium comfort and sleek design with our limited edition collection.</p>
            </div>
          </div>
          <div class="card-content">
            <div class="info-group">
              <h2 class="title">Nike Air Max</h2>
              <p class="price">$120.00</p>
            </div>
            <button class="buy-button">Add to Cart</button>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
